x-app-environment: &app-environment
  POSTGRES_DB: ${POSTGRES_DB:?Create .env with scripts/init_env.py}
  POSTGRES_USER: ${POSTGRES_USER:?Create .env with scripts/init_env.py}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env with scripts/init_env.py}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Create .env with scripts/init_env.py}
  DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Create .env with scripts/init_env.py}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env with scripts/init_env.py}
      POSTGRES_DB: ${POSTGRES_DB:?Create .env with scripts/init_env.py}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build: .
    environment: *app-environment
    ports:
      - "127.0.0.1:9000:9000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/healthz', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
    restart: unless-stopped

  test:
    profiles: ["test"]
    build:
      context: .
      target: development
    environment:
      <<: *app-environment
      RUN_INTEGRATION_TESTS: "1"
    command: ["sh", "-c", "python manage.py check && ruff check . && ruff format --check . && pytest -v"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
