[project]
name = "booking-service"
version = "0.1.0"
description = "HTTP JSON API for hotel rooms and bookings"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.16,<4.0",
    "drf-spectacular>=0.28,<0.29",
    "dj-database-url>=2.3,<4.0",
    "gunicorn>=23,<24; sys_platform != 'win32'",
    "psycopg[binary,pool]>=3.2,<4.0",
    "python-dotenv>=1.1,<2.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<10.0"
pytest-django = ">=4.11,<5.0"
httpx = ">=0.28,<1.0"
ruff = ">=0.11,<1.0"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "app.settings"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires PostgreSQL and RUN_INTEGRATION_TESTS=1 or TEST_DATABASE_URL"]
